# ManaWG, self-hosted: app, PostgreSQL, Supabase Auth and Storage, gateway and cron jobs.
# Quick start: ./docker/setup.sh && docker compose up -d   (see docs/self-hosting.md)
# All settings come from .env next to this file (template: .env.example).

name: manawg

x-app: &app
  image: ${MANAWG_IMAGE:-ghcr.io/abuarchiv/manawg-app}:${MANAWG_VERSION:-latest}
  build:
    context: .
    args:
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}

services:
  db:
    image: supabase/postgres:17.11.0.007
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./docker/setup.sh first}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${APP_URL}/auth/v1
      GOTRUE_SITE_URL: ${APP_URL}
      GOTRUE_URI_ALLOW_LIST: ${APP_URL}/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ISSUER: ${APP_URL}/auth/v1
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      # Per-visitor rate limits: the gateway sets X-Forwarded-For, the app passes it on.
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      # The sign-in form expects 8-digit codes.
      GOTRUE_MAILER_OTP_LENGTH: 8
      GOTRUE_MAILER_OTP_EXP: 3600
      # Links in mails go through the gateway's public /auth/v1 routes.
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-ManaWG}
      # Templates from supabase/templates, rendered for this instance by the setup service.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway:8000/mail-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://gateway:8000/mail-templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://gateway:8000/mail-templates/magic_link.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://gateway:8000/mail-templates/email_change.html
      GOTRUE_MAILER_TEMPLATES_PASSWORD_CHANGED_NOTIFICATION: http://gateway:8000/mail-templates/password_changed.html
      # Same subjects as supabase/templates/subjects.json.
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Bestätige deine E-Mail-Adresse
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Neues Passwort festlegen
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "{{ .Token }} ist dein Anmeldecode"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: Bestätige deine neue E-Mail-Adresse
      GOTRUE_MAILER_SUBJECTS_PASSWORD_CHANGED_NOTIFICATION: Dein Passwort wurde geändert
      GOTRUE_MAILER_NOTIFICATIONS_PASSWORD_CHANGED_ENABLED: "true"
      # Optional Google sign-in; register ${APP_URL}/auth/v1/callback as redirect URI at Google.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${APP_URL}/auth/v1/callback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    image: supabase/storage-api:v1.84.23
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${APP_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: stub
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - storage
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - mail-templates:/srv/mail-templates:ro
      - caddy-data:/data
      - caddy-config:/config

  # Runtime role, migrations, storage bucket and mail templates; exits when done.
  setup:
    <<: *app
    command: ["node", "scripts/selfhost/setup.mjs"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
      gateway:
        condition: service_started
    environment:
      DATABASE_MIGRATION_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      MANAWG_APP_DB_PASSWORD: ${MANAWG_APP_DB_PASSWORD}
      SUPABASE_INTERNAL_URL: http://gateway:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${STORAGE_BUCKET:-private-images}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_LEGAL_URL: ${LEGAL_URL:-}
      MAIL_TEMPLATES_DIR: /app/mail-templates
    volumes:
      - mail-templates:/app/mail-templates

  app:
    <<: *app
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      NEXT_PUBLIC_APP_URL: ${APP_URL:?set APP_URL in .env}
      NEXT_PUBLIC_SUPABASE_URL: ${APP_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      NEXT_PUBLIC_LEGAL_URL: ${LEGAL_URL:-}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOOGLE_SIGN_IN: ${GOOGLE_ENABLED:-false}
      SUPABASE_INTERNAL_URL: http://gateway:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${STORAGE_BUCKET:-private-images}
      POSTGRES_URL: postgres://manawg_app:${MANAWG_APP_DB_PASSWORD}@db:5432/postgres
      MEMBER_SESSION_SECRET: ${MEMBER_SESSION_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      STATEMENT_EMAIL_FROM: ${SMTP_SENDER_NAME:-ManaWG} <${SMTP_ADMIN_EMAIL}>
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:${SMTP_ADMIN_EMAIL}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Calls the /api/cron/* routes on the schedules in apps/web/vercel.json (UTC).
  cron:
    <<: *app
    command: ["node", "scripts/selfhost/cron.mjs"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_TARGET_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}

  # Local mail catch-all (profile "mailpit"): every mail lands at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    profiles: ["mailpit"]
    ports:
      - 127.0.0.1:8025:8025

volumes:
  db-data:
  db-config:
  storage-data:
  caddy-data:
  caddy-config:
  mail-templates:
