# Self-hosting image. Pull requests that touch the image or the paths the stack depends on, and
# every push to main, build it for linux/amd64, scan it with Trivy and run the whole stack through
# docker/smoke.sh. A tag vX.Y.Z builds linux/amd64, scans it with Trivy and only then builds
# linux/amd64 and linux/arm64 and pushes them to ghcr.io/abuarchiv/manawg-app as X.Y.Z, X.Y, X and
# latest.
name: Docker
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker/**
      - pnpm-lock.yaml
      - apps/web/package.json
      - apps/web/next.config.ts
      - apps/web/scripts/selfhost/**
      - apps/web/scripts/db-migrate/**
      - apps/web/drizzle/**
      - apps/web/vercel.json
      - apps/web/src/proxy.ts
      - apps/web/src/core/auth/**
      - apps/web/src/core/infra/**
      - apps/web/src/core/mail/**
      - supabase/templates/**
      - .github/workflows/docker.yml
  push:
    branches: [main]
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/abuarchiv/manawg-app
jobs:
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: manawg-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: manawg-app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Start the stack
        env:
          MANAWG_IMAGE: manawg-app
          MANAWG_VERSION: ci
        run: ./docker/setup.sh && docker compose up -d --no-build
      - name: Smoke test
        env:
          MANAWG_IMAGE: manawg-app
          MANAWG_VERSION: ci
        run: ./docker/smoke.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build linux/amd64 for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: manawg-app:release
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image before it is pushed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: manawg-app:release
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build and push the multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
