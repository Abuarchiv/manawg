name: CI

on:
  pull_request:
  push:
    branches: [main]
  deployment_status:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --dir apps/web analytics:check
      - run: pnpm --filter @manawg/web exec node scripts/check-feature-boundaries.mjs
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @manawg/web bundle:check

  e2e-fixtures:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manawg/web exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          NEXT_PUBLIC_DB_DOWN: 'true'
      - run: pnpm --filter @manawg/web test:e2e:fixtures
      - name: Record fixture execution evidence
        if: always()
        run: |
          {
            printf '%s\n' '### Fixture execution evidence'
            printf '%s\n' '- execution mode: fixture'
            printf '%s\n' '- base origin: http://localhost:3101'
            printf '%s\n' '- result: ${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"

  db-supabase-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    environment: Preview
    env:
      DATABASE_MIGRATION_URL: ${{ secrets.SUPABASE_PREVIEW_DATABASE_MIGRATION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the protected Supabase direct connection
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.SUPABASE_PREVIEW_DATABASE_MIGRATION_URL }}
        run: |
          test -n "$DATABASE_MIGRATION_URL"
          node <<'NODE'
          const url = new URL(process.env.DATABASE_MIGRATION_URL);
          if (
            !['postgres:', 'postgresql:'].includes(url.protocol) ||
            url.hostname.toLowerCase() !== 'db.sthiwjebcwwiphashgla.supabase.co' ||
            url.port !== '5432'
          ) {
            throw new Error('Preview database checks require the direct ManaWG Preview Supabase connection on port 5432.');
          }
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pending Preview migrations
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.SUPABASE_PREVIEW_DATABASE_MIGRATION_URL }}
        run: pnpm --filter @manawg/web db:migrate
      - run: pnpm --filter @manawg/web db:check

  e2e-preview:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.ref == 'main'
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - uses: actions/checkout@v4
        with:
          # Never execute an event-supplied deployment SHA in a secrets-bearing job.
          ref: main
      - name: Require trusted deployment revision
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          test -n "$DEPLOYMENT_SHA"
          test "$DEPLOYMENT_SHA" = "$(git rev-parse HEAD)"
      - name: Validate trusted Vercel Preview event and target
        id: preview
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_CREATOR: ${{ github.event.deployment.creator.login }}
          STATUS_CREATOR: ${{ github.event.deployment_status.creator.login }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          if (
            process.env.DEPLOYMENT_ENVIRONMENT !== 'Preview' ||
            process.env.DEPLOYMENT_CREATOR !== 'vercel[bot]' ||
            process.env.STATUS_CREATOR !== 'vercel[bot]'
          ) {
            throw new Error('Preview deployment event is not from the trusted Vercel deployment.');
          }

          const target = process.env.TARGET_URL;
          const expectedOrigin = /^https:\/\/manawg-[a-z0-9-]+-abditubes-projects\.vercel\.app$/;
          if (typeof target !== 'string' || !expectedOrigin.test(target)) {
            throw new Error('Preview target is not this project\'s canonical Vercel origin.');
          }
          const url = new URL(target);
          if (url.origin !== target) {
            throw new Error('Preview target must exactly equal its canonical Vercel origin.');
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `base_url=${url.origin}\n`);
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manawg/web exec playwright install --with-deps chromium
      - name: Require real Supabase QA credentials
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_SUPABASE_TEST_EMAIL: ${{ secrets.E2E_SUPABASE_TEST_EMAIL }}
          E2E_SUPABASE_TEST_PASSWORD: ${{ secrets.E2E_SUPABASE_TEST_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$E2E_SUPABASE_URL"
          test -n "$E2E_SUPABASE_PUBLISHABLE_KEY"
          test -n "$E2E_SUPABASE_TEST_EMAIL"
          test -n "$E2E_SUPABASE_TEST_PASSWORD"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          node <<'NODE'
          const url = new URL(process.env.E2E_SUPABASE_URL);
          if (
            url.protocol !== 'https:' ||
            url.hostname.toLowerCase() !== 'sthiwjebcwwiphashgla.supabase.co' ||
            url.port ||
            url.pathname !== '/' ||
            url.search ||
            url.hash
          ) {
            throw new Error('Preview E2E auth must use the ManaWG Preview Supabase project.');
          }
          NODE
      - name: Test the protected Preview deployment
        env:
          BASE_URL: ${{ steps.preview.outputs.base_url }}
          PREVIEW_E2E: 'true'
          REAL_PRODUCT_E2E: 'true'
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_SUPABASE_TEST_EMAIL: ${{ secrets.E2E_SUPABASE_TEST_EMAIL }}
          E2E_SUPABASE_TEST_PASSWORD: ${{ secrets.E2E_SUPABASE_TEST_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PUBLIC_ENTRY_E2E: 'true'
          AUTH_LIVE_E2E: 'true'
          SUPABASE_AUTH_LIVE_E2E: 'true'
        run: pnpm --filter @manawg/web exec playwright test --retries=0 preview-protection.spec.ts smoke-launch.spec.ts
      - name: Record protected Preview execution evidence
        if: always()
        env:
          VALIDATED_TARGET_ORIGIN: ${{ steps.preview.outputs.base_url || 'not-validated' }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          {
            printf '%s\n' '### Protected Preview execution evidence'
            printf '%s\n' "- validated target origin: $VALIDATED_TARGET_ORIGIN"
            printf '%s\n' "- deployment identifier: $DEPLOYMENT_ID"
            printf '%s\n' "- source revision: $DEPLOYMENT_SHA"
            printf '%s\n' '- execution mode: protected-preview'
            printf '%s\n' '- result: ${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"
