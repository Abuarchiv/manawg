name: CI

on:
  pull_request:
  push:
    branches: [main]
  deployment_status:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --dir apps/web analytics:check
      - run: pnpm --filter @manawg/web exec node scripts/check-feature-boundaries.mjs
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @manawg/web bundle:check

  e2e-fixtures:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manawg/web exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          NEXT_PUBLIC_DB_DOWN: 'true'
      - run: pnpm --filter @manawg/web test:e2e:fixtures
      - name: Record fixture execution evidence
        if: always()
        run: |
          {
            printf '%s\n' '### Fixture execution evidence'
            printf '%s\n' '- execution mode: fixture'
            printf '%s\n' '- base origin: http://localhost:3101'
            printf '%s\n' '- result: ${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"

  db-supabase-preview:
    if: >-
      always() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.validate.result == 'success'
        ) ||
        (
          github.event_name == 'deployment_status' &&
          github.event.deployment_status.state == 'success' &&
          github.event.deployment.environment == 'Preview'
        )
      )
    runs-on: ubuntu-latest
    needs: validate
    environment: Preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Require the exact source revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          export CHECKED_OUT_SHA
          node --input-type=module <<'NODE'
          import { assertExactRevision } from './apps/web/scripts/release-workflow-gates.mjs';

          const expectedSha = process.env.EVENT_NAME === 'deployment_status'
            ? process.env.DEPLOYMENT_SHA
            : process.env.SOURCE_SHA;
          assertExactRevision(expectedSha, process.env.CHECKED_OUT_SHA);
          NODE
      - name: Require a trusted Vercel Preview event
        if: github.event_name == 'deployment_status'
        env:
          DEPLOYMENT_STATUS: ${{ github.event.deployment_status.state }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_CREATOR: ${{ github.event.deployment.creator.login }}
          STATUS_CREATOR: ${{ github.event.deployment_status.creator.login }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          node --input-type=module <<'NODE'
          import { assertPreviewEvent } from './apps/web/scripts/release-workflow-gates.mjs';

          assertPreviewEvent({
            state: process.env.DEPLOYMENT_STATUS,
            deploymentRef: process.env.DEPLOYMENT_REF,
            deploymentSha: process.env.DEPLOYMENT_SHA,
            environment: process.env.DEPLOYMENT_ENVIRONMENT,
            deploymentCreator: process.env.DEPLOYMENT_CREATOR,
            statusCreator: process.env.STATUS_CREATOR,
            targetUrl: process.env.TARGET_URL,
          });
          NODE
      - name: Require the protected Supabase direct connection
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.SUPABASE_PREVIEW_DATABASE_MIGRATION_URL }}
        run: |
          test -n "$DATABASE_MIGRATION_URL"
          node <<'NODE'
          const url = new URL(process.env.DATABASE_MIGRATION_URL);
          if (
            !['postgres:', 'postgresql:'].includes(url.protocol) ||
            url.hostname.toLowerCase() !== 'db.sthiwjebcwwiphashgla.supabase.co' ||
            url.port !== '5432'
          ) {
            throw new Error('Preview database checks require the direct ManaWG Preview Supabase connection on port 5432.');
          }
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply pending Preview migrations
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.SUPABASE_PREVIEW_DATABASE_MIGRATION_URL }}
        run: pnpm --filter @manawg/web db:migrate
      - name: Verify Preview schema and migration ledger
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.SUPABASE_PREVIEW_DATABASE_MIGRATION_URL }}
        run: pnpm --filter @manawg/web db:check

  e2e-preview:
    if: >-
      always() &&
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    needs: db-supabase-preview
    environment: Preview
    steps:
      - name: Require the same-SHA Preview migration gate
        env:
          MIGRATION_GATE_RESULT: ${{ needs.db-supabase-preview.result }}
        run: test "$MIGRATION_GATE_RESULT" = success
      - uses: actions/checkout@v4
        with:
          # Never execute an event-supplied deployment SHA in a secrets-bearing job.
          ref: main
      - name: Require trusted deployment revision
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          export CHECKED_OUT_SHA
          node --input-type=module <<'NODE'
          import { assertExactRevision } from './apps/web/scripts/release-workflow-gates.mjs';

          assertExactRevision(process.env.DEPLOYMENT_SHA, process.env.CHECKED_OUT_SHA);
          NODE
      - name: Validate trusted Vercel Preview event and target
        id: preview
        env:
          DEPLOYMENT_STATUS: ${{ github.event.deployment_status.state }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_CREATOR: ${{ github.event.deployment.creator.login }}
          STATUS_CREATOR: ${{ github.event.deployment_status.creator.login }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { assertPreviewEvent } from './apps/web/scripts/release-workflow-gates.mjs';

          const baseUrl = assertPreviewEvent({
            state: process.env.DEPLOYMENT_STATUS,
            deploymentRef: process.env.DEPLOYMENT_REF,
            deploymentSha: process.env.DEPLOYMENT_SHA,
            environment: process.env.DEPLOYMENT_ENVIRONMENT,
            deploymentCreator: process.env.DEPLOYMENT_CREATOR,
            statusCreator: process.env.STATUS_CREATOR,
            targetUrl: process.env.TARGET_URL,
          });

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `base_url=${baseUrl}\n`);
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manawg/web exec playwright install --with-deps chromium
      - name: Require real Supabase QA credentials
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_SUPABASE_TEST_EMAIL: ${{ secrets.E2E_SUPABASE_TEST_EMAIL }}
          E2E_SUPABASE_TEST_PASSWORD: ${{ secrets.E2E_SUPABASE_TEST_PASSWORD }}
          SUPABASE_AUTH_TEST_EMAIL: ${{ secrets.SUPABASE_AUTH_TEST_EMAIL }}
          SUPABASE_AUTH_TEST_PASSWORD: ${{ secrets.SUPABASE_AUTH_TEST_PASSWORD }}
          SUPABASE_AUTH_TEST_MEMBER_WG_CODE: ${{ secrets.SUPABASE_AUTH_TEST_MEMBER_WG_CODE }}
          SUPABASE_AUTH_TEST_MEMBER_NAME: ${{ secrets.SUPABASE_AUTH_TEST_MEMBER_NAME }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import {
            PREVIEW_AUTH_ENV_NAMES,
            assertRequiredEnv,
          } from './apps/web/scripts/release-workflow-gates.mjs';

          assertRequiredEnv(process.env, [
            'E2E_SUPABASE_URL',
            'E2E_SUPABASE_PUBLISHABLE_KEY',
            'E2E_SUPABASE_TEST_EMAIL',
            'E2E_SUPABASE_TEST_PASSWORD',
            'VERCEL_AUTOMATION_BYPASS_SECRET',
            ...PREVIEW_AUTH_ENV_NAMES,
          ], 'Protected Preview verification');
          NODE
          node <<'NODE'
          const url = new URL(process.env.E2E_SUPABASE_URL);
          if (
            url.protocol !== 'https:' ||
            url.hostname.toLowerCase() !== 'sthiwjebcwwiphashgla.supabase.co' ||
            url.port ||
            url.pathname !== '/' ||
            url.search ||
            url.hash
          ) {
            throw new Error('Preview E2E auth must use the ManaWG Preview Supabase project.');
          }
          NODE
      - name: Test the protected Preview deployment
        env:
          BASE_URL: ${{ steps.preview.outputs.base_url }}
          PREVIEW_E2E: 'true'
          REAL_PRODUCT_E2E: 'true'
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
          E2E_SUPABASE_TEST_EMAIL: ${{ secrets.E2E_SUPABASE_TEST_EMAIL }}
          E2E_SUPABASE_TEST_PASSWORD: ${{ secrets.E2E_SUPABASE_TEST_PASSWORD }}
          SUPABASE_AUTH_TEST_EMAIL: ${{ secrets.SUPABASE_AUTH_TEST_EMAIL }}
          SUPABASE_AUTH_TEST_PASSWORD: ${{ secrets.SUPABASE_AUTH_TEST_PASSWORD }}
          SUPABASE_AUTH_TEST_MEMBER_WG_CODE: ${{ secrets.SUPABASE_AUTH_TEST_MEMBER_WG_CODE }}
          SUPABASE_AUTH_TEST_MEMBER_NAME: ${{ secrets.SUPABASE_AUTH_TEST_MEMBER_NAME }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PUBLIC_ENTRY_E2E: 'true'
          AUTH_LIVE_E2E: 'true'
          SUPABASE_AUTH_LIVE_E2E: 'true'
          SUPABASE_AUTH_PASSWORD_RESET_SMOKE: 'true'
        run: pnpm --filter @manawg/web exec playwright test --retries=0 preview-protection.spec.ts smoke-launch.spec.ts public-entry-live.spec.ts social-login-live.spec.ts supabase-auth-live.spec.ts
      - name: Record protected Preview execution evidence
        if: always()
        env:
          VALIDATED_TARGET_ORIGIN: ${{ steps.preview.outputs.base_url || 'not-validated' }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          {
            printf '%s\n' '### Protected Preview execution evidence'
            printf '%s\n' "- validated target origin: $VALIDATED_TARGET_ORIGIN"
            printf '%s\n' "- deployment identifier: $DEPLOYMENT_ID"
            printf '%s\n' "- source revision: $DEPLOYMENT_SHA"
            printf '%s\n' '- execution mode: protected-preview'
            printf '%s\n' '- result: ${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"
