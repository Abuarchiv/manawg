# Every pull request and every push to main: lint, types, unit tests, build and bundle budget
# (validate), then the end-to-end suite against fixture data (e2e-fixtures). Both are required
# checks, and release-production.yml requires both on the release commit.
name: CI

on:
  # No `labeled`: labels gate nothing, so adding one must not rerun (and cancel) CI.
  # No paths-ignore: docs-only PRs still report the required `validate` status.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Newer pushes to a pull request cancel its older run; pushes to main never cancel.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on draft PRs too so feedback arrives before review.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          # Keyed by inputs, not the commit, so unchanged sources reuse one entry.
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/next.config.ts', 'apps/web/tsconfig.json', 'apps/web/postcss.config.js') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Lint and project rules
        run: pnpm lint
      - name: Unused files, exports and dependencies
        run: pnpm knip
      - name: Analytics privacy
        run: pnpm --dir apps/web analytics:check
      - name: Schema matches the committed migrations
        run: |
          DATABASE_URL=postgres://u:p@localhost:5432/x pnpm --filter @manawg/web db:generate --name=ci_drift
          if [ -n "$(git status --porcelain apps/web/drizzle)" ]; then
            git status --porcelain apps/web/drizzle >&2
            echo 'schema.ts differs from the committed migrations: run drizzle-kit generate and commit the result.' >&2
            exit 1
          fi
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm --filter @manawg/web test:unit
      - name: Unit tests in the UTC+14 time zone
        run: TZ=Pacific/Kiritimati pnpm --filter @manawg/web test:unit
      - name: Build
        run: pnpm build
      - name: Bundle budget
        run: pnpm --filter @manawg/web bundle:check

  # Every non-draft PR and every push to main.
  e2e-fixtures:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright-browser: chromium
      - name: End-to-end tests with fixture data
        run: pnpm --filter @manawg/web test:e2e:fixtures
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-fixtures-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Record fixture execution evidence
        if: always()
        run: |
          {
            printf '%s\n' '### Fixture execution evidence'
            printf '%s\n' '- execution mode: fixture'
            printf '%s\n' '- base origin: http://localhost:3101'
            printf '%s\n' '- result: ${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"
