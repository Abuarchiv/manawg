name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @manawg/web exec node scripts/check-feature-boundaries.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @manawg/web bundle:check

  db-integration:
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: manawg
          POSTGRES_PASSWORD: manawg
          POSTGRES_DB: manawg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manawg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://manawg:manawg@localhost:5432/manawg_ci
      DATABASE_MIGRATION_URL: postgres://manawg:manawg@localhost:5432/manawg_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manawg/web db:migrate
      - run: pnpm --filter @manawg/web test

  e2e-fixtures:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manawg/web exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          NEXT_PUBLIC_DB_DOWN: 'true'
      - run: pnpm --filter @manawg/web test:e2e:fixtures

  e2e-real-db:
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: manawg
          POSTGRES_PASSWORD: manawg
          POSTGRES_DB: manawg_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manawg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://manawg:manawg@localhost:5432/manawg_e2e
      DATABASE_MIGRATION_URL: postgres://manawg:manawg@localhost:5432/manawg_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manawg/web exec playwright install --with-deps chromium
      - run: pnpm --filter @manawg/web db:migrate
      - run: pnpm --filter @manawg/web exec playwright test smoke-launch.spec.ts
