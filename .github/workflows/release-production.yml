# One dispatch for the documented release: main tip -> Preview gate -> production migration ->
# production deployment -> tag, GitHub release and Docker image for the version in package.json.
# Each stage waits for the previous one and stops the release on failure.
# Vercel is optional: with PREVIEW_GATE=database the Preview gate is the Preview database
# migration check and PRODUCTION_DEPLOY_HOOK deploys a self-hosted instance
# (docs/development.md, Releases). Gate and hook are checked before anything runs.
name: Release production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RELEASE_PRODUCTION to release the current main tip.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  # Repository variable of the deployed instance; forks without it skip releases.
  PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}

jobs:
  release:
    if: vars.PRODUCTION_APP_URL != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    timeout-minutes: 150
    environment:
      name: Production
      deployment: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Verify dispatch
        id: candidate
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          VERCEL_PRODUCTION_DEPLOY_HOOK: ${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK }}
          PREVIEW_GATE: ${{ vars.PREVIEW_GATE }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Release only from main.' >&2; exit 1; }
          [ "$CONFIRMATION" = RELEASE_PRODUCTION ] || { echo 'Confirmation must be RELEASE_PRODUCTION.' >&2; exit 1; }
          # Fails here, before any migration, when no gate or no usable deploy hook is configured.
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { selectDeployHook, selectPreviewGate } from './apps/web/scripts/release-workflow-gates.mjs';

          const gate = selectPreviewGate(process.env);
          const hook = selectDeployHook(gate, process.env);
          appendFileSync(process.env.GITHUB_OUTPUT, `gate=${gate}\nhook=${hook}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Preview gate: ${gate}, deploy hook: ${hook}\n`);
          NODE
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the version
        id: version
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          version="$(jq -r .version package.json)"
          node scripts/release-notes.mjs "v$version" > /dev/null
          # A tag on another commit means main changed since that release: bump the version first.
          # The peeled ref (^{}) of an annotated tag is the commit; a lightweight tag has none.
          refs="$(git ls-remote origin "refs/tags/v$version" "refs/tags/v$version^{}")"
          tagged="$(grep -F "^{}" <<<"$refs" | cut -f1 || true)"
          [ -n "$tagged" ] || tagged="$(cut -f1 <<<"$refs")"
          if [ -n "$tagged" ] && [ "$tagged" != "$SHA" ]; then
            echo "v$version is already released from $tagged. Bump the version in package.json and add its CHANGELOG.md section." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for main CI
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          for _ in $(seq 60); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')"
            case "$run" in
              'completed success') exit 0 ;;
              completed*) echo "Main CI for $SHA ended: $run" >&2; exit 1 ;;
            esac
            sleep 30
          done
          echo 'Main CI did not finish in time.' >&2
          exit 1

      - name: Pass the Preview gate
        id: preview
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
          GATE: ${{ steps.candidate.outputs.gate }}
        run: |
          # vercel: Vercel builds preview-main and reports a deployment_status; that Preview run
          # (migration check and end-to-end tests) is the gate. database: the Preview migration
          # check that preview.yml runs after main CI is the gate. migrate-production.yml
          # checks the run against the same PREVIEW_GATE again.
          # Preview runs of $SHA as JSON for previewGateVerdict: [{id, jobs}], jobs of the latest attempt.
          event="$([ "$GATE" = vercel ] && echo deployment_status || echo workflow_run)"
          preview_runs() {
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/preview.yml/runs?head_sha=$SHA&event=$event&per_page=50" \
              --jq '.workflow_runs[].id'); do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                --jq "{id: $id, jobs: [.jobs[] | {name, status, conclusion, run_attempt}]}"
            done | jq -cs .
          }
          if [ "$GATE" = vercel ] && [ "$(git ls-remote origin refs/heads/preview-main | cut -f1)" != "$SHA" ]; then
            git push --force origin "$SHA:refs/heads/preview-main"
          fi
          for _ in $(seq 120); do
            runs="$(preview_runs)"
            verdict="$(RUNS="$runs" node --input-type=module -e "
              import { previewGateVerdict } from './apps/web/scripts/release-workflow-gates.mjs';
              const { state, runId } = previewGateVerdict(process.env.GATE, JSON.parse(process.env.RUNS));
              console.log(state, runId ?? '');
            ")"
            read -r state run_id <<<"$verdict"
            if [ "$state" = passed ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Preview gate ($GATE) run: $run_id" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$state" = failed ]; then
              echo "Preview gate ($GATE) failed for $SHA in run $run_id:" >&2
              echo "$runs" >&2
              exit 1
            fi
            # The gate only trusts the current main tip; a newer main needs a new release dispatch.
            if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$SHA" ]; then
              echo "main moved past $SHA; dispatch the release again for the new tip." >&2
              exit 1
            fi
            sleep 30
          done
          echo "Preview gate ($GATE) did not pass in time for $SHA:" >&2
          echo "$runs" >&2
          exit 1

      - name: Migrate the production database
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
          PREVIEW_RUN_ID: ${{ steps.preview.outputs.run_id }}
        run: |
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run migrate-production.yml --ref main \
            -f candidate_sha="$SHA" -f preview_run_id="$PREVIEW_RUN_ID" -f confirmation=MIGRATE_PRODUCTION
          id=''
          for _ in $(seq 20); do
            id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/migrate-production.yml/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
            [ -n "$id" ] && break
            sleep 6
          done
          [ -n "$id" ] || { echo 'Migration run did not start.' >&2; exit 1; }
          echo "Migration run: $id" >> "$GITHUB_STEP_SUMMARY"
          gh run watch "$id" --exit-status --interval 20 > /dev/null

      - name: Deploy production
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
          HOOK: ${{ steps.candidate.outputs.hook }}
          PRODUCTION_DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          VERCEL_PRODUCTION_DEPLOY_HOOK: ${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK }}
        run: |
          # HOOK names the secret chosen in "Verify dispatch" (selectDeployHook).
          case "$HOOK" in
            PRODUCTION_DEPLOY_HOOK) deploy_hook="$PRODUCTION_DEPLOY_HOOK" ;;
            VERCEL_PRODUCTION_DEPLOY_HOOK) deploy_hook="$VERCEL_PRODUCTION_DEPLOY_HOOK" ;;
            *) echo "Unknown deploy hook: $HOOK" >&2; exit 1 ;;
          esac
          # The hook builds the main tip; if main moved meanwhile, the version check below fails.
          curl -fsS -X POST "$deploy_hook" > /dev/null
          for attempt in $(seq 120); do
            # A unique query bypasses the CDN copy of a healthy answer (it may still name the old commit).
            health="$(curl -sS "$PRODUCTION_APP_URL/api/health?t=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" || true)"
            if jq -e --arg sha "$SHA" '.version == $sha and .status == "ok" and .database == "ok"' <<<"$health" > /dev/null 2>&1; then
              echo "Production serves $SHA: $health" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "Production does not serve $SHA healthily: $health" >&2
          exit 1

      - name: Publish the release
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION exists already." >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/release-notes.mjs "v$VERSION" > notes.md
            gh release create "v$VERSION" --target "$SHA" --title "ManaWG $VERSION" --notes-file notes.md --latest
            echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi
          # A tag pushed with this token starts no workflow, so the image build is dispatched.
          gh workflow run docker.yml --ref "v$VERSION"
