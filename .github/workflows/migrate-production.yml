name: Migrate production database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE_PRODUCTION to run the production migration.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = MIGRATE_PRODUCTION
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify direct Supabase migration connection
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          test -n "$DATABASE_MIGRATION_URL"
          node <<'NODE'
          const url = new URL(process.env.DATABASE_MIGRATION_URL);
          if (
            !['postgres:', 'postgresql:'].includes(url.protocol) ||
            url.hostname.toLowerCase() !== 'db.bwsvsvfgbrsonepffqff.supabase.co' ||
            url.port !== '5432'
          ) {
            throw new Error('Production migration requires the direct ManaWG Production Supabase connection on port 5432.');
          }
          NODE
      - name: Apply pending migrations
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: pnpm --filter @manawg/web db:migrate
      - name: Verify production schema and migration ledger
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: pnpm --filter @manawg/web db:check
