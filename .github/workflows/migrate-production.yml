name: Migrate production database

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character SHA of the approved current main candidate.
        required: true
        type: string
      preview_run_id:
        description: CI run ID whose protected Preview gate passed for the exact candidate SHA.
        required: true
        type: string
      confirmation:
        description: Type MIGRATE_PRODUCTION to run the production migration.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  verify-candidate-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the approved current main candidate
        env:
          WORKFLOW_REF: ${{ github.ref }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          export CHECKED_OUT_SHA
          node --input-type=module <<'NODE'
          import { assertProductionDispatch } from './apps/web/scripts/release-workflow-gates.mjs';

          assertProductionDispatch({
            workflowRef: process.env.WORKFLOW_REF,
            candidateSha: process.env.CANDIDATE_SHA,
            checkedOutSha: process.env.CHECKED_OUT_SHA,
            confirmation: process.env.CONFIRMATION,
          });
          NODE
      - name: Verify successful exact-candidate push CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          # candidate_sha was validated against checked-out main above and is passed through env.
          gh api --header 'Accept: application/vnd.github+json' --paginate --slurp \
            "/repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE_SHA&branch=main&event=push&per_page=100" > "$RUNNER_TEMP/main-ci-runs.json"
          export MAIN_CI_RUNS_JSON="$RUNNER_TEMP/main-ci-runs.json"
          MAIN_CI_RUN_ID="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const pages = JSON.parse(readFileSync(process.env.MAIN_CI_RUNS_JSON, 'utf8'));
          const run = pages.flatMap((page) => page.workflow_runs ?? []).find(
            (candidate) => Number.isInteger(candidate?.id) && candidate.id > 0,
          );
          if (!run) {
            throw new Error('No main push CI run was found for the candidate SHA.');
          }
          process.stdout.write(String(run.id));
          NODE
          )"
          if ! [[ "$MAIN_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'Main CI evidence did not provide a positive Actions run ID.' >&2
            exit 1
          fi
          gh api --header 'Accept: application/vnd.github+json' --paginate --slurp \
            "/repos/$REPOSITORY/actions/runs/$MAIN_CI_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/main-ci-jobs.json"
          export MAIN_CI_RUN_ID MAIN_CI_JOBS_JSON="$RUNNER_TEMP/main-ci-jobs.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { assertMainCiEvidence } from './apps/web/scripts/release-workflow-gates.mjs';

          const pages = JSON.parse(readFileSync(process.env.MAIN_CI_RUNS_JSON, 'utf8'));
          const run = pages.flatMap((page) => page.workflow_runs ?? []).find(
            (candidate) => candidate?.id === Number(process.env.MAIN_CI_RUN_ID),
          );
          const jobPages = JSON.parse(readFileSync(process.env.MAIN_CI_JOBS_JSON, 'utf8'));
          const evidence = assertMainCiEvidence({
            candidateSha: process.env.CANDIDATE_SHA,
            run,
            jobs: jobPages.flatMap((page) => page.jobs ?? []),
          });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Main push-CI run (validate + e2e-fixtures): ${evidence.ciRunId}\n`);
          NODE
  migrate:
    needs: verify-candidate-ci
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify exact-SHA protected Preview evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if ! [[ "$PREVIEW_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'preview_run_id must be a positive numeric Actions run ID.' >&2
            exit 1
          fi
          gh api --header 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/actions/runs/$PREVIEW_RUN_ID" > "$RUNNER_TEMP/preview-run.json"
          gh api --header 'Accept: application/vnd.github+json' \
            "/repos/$REPOSITORY/actions/runs/$PREVIEW_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/preview-jobs.json"
          export PREVIEW_RUN_JSON="$RUNNER_TEMP/preview-run.json"
          export PREVIEW_JOBS_JSON="$RUNNER_TEMP/preview-jobs.json"
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'candidate_sha must be a full 40-character commit SHA.' >&2
            exit 1
          fi
          RUN_HEAD_SHA="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const run = JSON.parse(readFileSync(process.env.PREVIEW_RUN_JSON, 'utf8'));
          if (typeof run.head_sha !== 'string' || !/^[0-9a-fA-F]{40}$/.test(run.head_sha)) {
            throw new Error('Preview CI run must expose a full 40-character head SHA.');
          }
          process.stdout.write(run.head_sha);
          NODE
          )"
          CANDIDATE_TREE="$(git rev-parse "$CANDIDATE_SHA^{tree}")"
          git fetch --no-tags --depth=1 origin "$RUN_HEAD_SHA"
          RUN_TREE="$(git rev-parse "$RUN_HEAD_SHA^{tree}")"
          export CANDIDATE_TREE RUN_TREE
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { assertPreviewEvidence } from './apps/web/scripts/release-workflow-gates.mjs';

          const previewRunId = Number(process.env.PREVIEW_RUN_ID);
          assertPreviewEvidence({
            candidateSha: process.env.CANDIDATE_SHA,
            candidateTree: process.env.CANDIDATE_TREE,
            expectedRunId: previewRunId,
            run: JSON.parse(readFileSync(process.env.PREVIEW_RUN_JSON, 'utf8')),
            runTree: process.env.RUN_TREE,
            jobs: JSON.parse(readFileSync(process.env.PREVIEW_JOBS_JSON, 'utf8')).jobs,
          });
          NODE
      - name: Recheck current main before production connection
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          CURRENT_MAIN_SHA="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          export CURRENT_MAIN_SHA CHECKED_OUT_SHA
          node --input-type=module <<'NODE'
          import { assertExactRevision } from './apps/web/scripts/release-workflow-gates.mjs';

          assertExactRevision(process.env.CANDIDATE_SHA, process.env.CHECKED_OUT_SHA);
          assertExactRevision(process.env.CANDIDATE_SHA, process.env.CURRENT_MAIN_SHA);
          NODE
      - name: Verify direct Supabase migration connection
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: |
          test -n "$DATABASE_MIGRATION_URL"
          node <<'NODE'
          const url = new URL(process.env.DATABASE_MIGRATION_URL);
          if (
            !['postgres:', 'postgresql:'].includes(url.protocol) ||
            url.hostname.toLowerCase() !== 'db.bwsvsvfgbrsonepffqff.supabase.co' ||
            url.port !== '5432'
          ) {
            throw new Error('Production migration requires the direct ManaWG Production Supabase connection on port 5432.');
          }
          NODE
      - name: Apply pending migrations
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: pnpm --filter @manawg/web db:migrate
      - name: Verify production schema and migration ledger
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: pnpm --filter @manawg/web db:check
      - name: Record production migration evidence
        if: always()
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
        run: |
          {
            printf '%s\n' '### Production migration evidence'
            printf '%s\n' "candidate main SHA: $CANDIDATE_SHA"
            printf '%s\n' "exact-SHA Preview CI run: $PREVIEW_RUN_ID"
            printf '%s\n' '- execution mode: protected-production-migration'
            printf '%s\n' '- result: ${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"
