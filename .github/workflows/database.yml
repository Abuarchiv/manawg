# Database tests against a disposable PostgreSQL: the statement-run ledger, connection handling,
# private image deletions, the shopping unique index (pnpm test:db), the runtime pool timeouts
# against their own server (pnpm test:db-timeouts) and the account-deletion suite
# (test:e2e:account-delete-db). Every pull request and every push to main, so the check can be
# required without blocking unrelated pull requests.
name: Database
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: manawg_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_URL: postgresql://postgres@127.0.0.1:55432/manawg_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply the migrations
        run: node apps/web/scripts/test-db-setup.mjs "$DB_URL"
      - name: Database unit tests
        run: TEST_DATABASE_URL="$DB_URL" pnpm --filter @manawg/web test:db
      - name: Put the PostgreSQL server binaries on PATH
        run: |
          bins=(/usr/lib/postgresql/*/bin)
          if [ ! -d "${bins[0]}" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
            bins=(/usr/lib/postgresql/*/bin)
          fi
          printf '%s\n' "${bins[@]}" | sort -V | tail -n 1 >> "$GITHUB_PATH"
      - name: Database timeout tests
        run: pnpm --filter @manawg/web test:db-timeouts
      - name: Account deletion suite
        run: ACCOUNT_DELETE_TEST_URL="$DB_URL" pnpm --filter @manawg/web test:e2e:account-delete-db
