# Database tests against a disposable PostgreSQL: every unit and database suite in one run with
# coverage (pnpm test:coverage, which also starts the runtime pool timeout case against its own
# server), a coverage floor for the money and invite code that also fails on any skipped test,
# and the account-deletion suite (test:e2e:account-delete-db). Every pull request and every push
# to main, so the check can be required without blocking unrelated pull requests.
name: Database
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: manawg_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_URL: postgresql://postgres@127.0.0.1:55432/manawg_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Apply the migrations
        run: node apps/web/scripts/test-db-setup.mjs "$DB_URL"
      - name: Put the PostgreSQL server binaries on PATH
        run: |
          bins=(/usr/lib/postgresql/*/bin)
          if [ ! -d "${bins[0]}" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
            bins=(/usr/lib/postgresql/*/bin)
          fi
          printf '%s\n' "${bins[@]}" | sort -V | tail -n 1 >> "$GITHUB_PATH"
      - name: Unit and database tests with coverage floor
        run: TEST_DATABASE_URL="$DB_URL" pnpm --filter @manawg/web test:coverage
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: apps/web/coverage
          retention-days: 14
      - name: Account deletion suite
        run: ACCOUNT_DELETE_TEST_URL="$DB_URL" pnpm --filter @manawg/web test:e2e:account-delete-db
