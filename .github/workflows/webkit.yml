# Weekly WebKit run of the fixture e2e suite. The pull request lane runs Chromium only; this one
# catches Safari-only regressions without slowing every pull request. Not a required check.
name: WebKit

on:
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright-browser: webkit
      - run: pnpm --filter @manawg/web test:e2e:webkit
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-report
          path: apps/web/playwright-report
          retention-days: 7
