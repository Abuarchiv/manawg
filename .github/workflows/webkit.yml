# Weekly WebKit run of the fixture e2e suite. The pull request lane runs Chromium only; this one
# catches Safari-only regressions without slowing every pull request. Not a required check.
name: WebKit

on:
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --filter @manawg/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-webkit
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @manawg/web exec playwright install --with-deps webkit
      # The cache holds the browser only; system libraries still come from apt.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @manawg/web exec playwright install-deps webkit
      - run: pnpm --filter @manawg/web test:e2e:webkit
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-report
          path: apps/web/playwright-report
          retention-days: 7
